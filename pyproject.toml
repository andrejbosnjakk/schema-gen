[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemagen"
version = "0.1.0"
description = "Wire list to harness drawings, cut lists, test sheets and (later) current-flow simulation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["wireviz==0.4.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
schemagen = "schemagen.cli:main"

[tool.setuptools]
packages = ["schemagen"]

[tool.setuptools.package-data]
schemagen = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
