[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-gen"  # the import package and the command stay `schemagen` (that PyPI name is taken)
version = "0.6.0"
description = "Wiring design from one source of truth: harness drawings, tables, pinouts, checks, test sheets and a DC simulation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# wireviz (GPL-3.0) is only ever run as a separate command, never imported
dependencies = ["wireviz==0.4.1", "pyyaml>=6", "pydantic>=2.5", "openpyxl>=3.1", "numpy>=1.24", "scipy>=1.10", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
xlsx = []  # openpyxl is a core dependency since 0.3; kept so `schema-gen[xlsx]` still installs
sim = []   # numpy and scipy are core dependencies since 0.4
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "httpx>=0.27", "pip-licenses>=5"]

[project.scripts]
schemagen = "schemagen.cli:main"

[tool.setuptools.packages.find]
include = ["schemagen*"]

[tool.setuptools.package-data]
schemagen = ["templates/*.html", "core/data/*.yml", "app/static/*.html", "app/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: timing limits (CI runs them without coverage tracing)"]

[tool.ruff]
line-length = 165
target-version = "py310"
extend-exclude = ["examples", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# compact style of the existing modules: one-line if/for bodies and short lambdas are fine
ignore = ["E701", "E702", "E731", "E741", "B905", "B007", "I001", "E401", "B023", "UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]  # the equivalent of --strict for the typed core and the simulation
module = ["schemagen.core.*", "schemagen.sim.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
