# Demo project (fictional vehicle). Paths are relative to this file.
wirelist: wirelist
cards: cards
out: out
default_harnesses: [X-BH]

buses: [GNDB, BB1]
breaker_prefixes: [CB-]
splice_prefix: SP-
near_words: [cabin]

# no display.py in this project, so harness connectors are declared here: prefix -> [name, code, far side]
harnesses:
  X-BH: [Bulkhead connector X-BH, X-BH, engine]

# pin names: cards with a ```yaml schemagen block are found automatically (ECU_card.md);
# cards with only a markdown pin table are mapped here
cardmap:
  - {device: '^OTS$', connector: 'Lead', card: OTS_card.md, table: 'Leads'}
