# Demo project (fictional small aircraft). Paths are relative to this file.
wirelist: wirelist
cards: cards
out: out
default_harnesses: [X-FW]

buses: [GNDB, BB1]
breaker_prefixes: [CB-]
splice_prefix: SP-
