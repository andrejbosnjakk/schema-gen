name: installer
on:
  push:
    branches: ["dev/1.2*"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # a v* tag publishes the installer as a GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Inno Setup (preinstalled on windows-latest; install it if an image ever drops it)
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: build the app and the installer
        shell: pwsh
        run: ./packaging/build.ps1 -Python python
      - name: smoke test the built app (window opens, /api/health answers, closes cleanly)
        shell: pwsh
        run: ./packaging/smoke.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: schemagen-installer
          path: packaging/dist/schemagen-setup-*.exe
          if-no-files-found: error
      - name: release on a v* tag (a tag with a "-", such as v1.2.0-dev, is a pre-release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash  # pwsh handed gh a stray "-" argument ("no matches found for `-`")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" packaging/dist/schemagen-setup-*.exe "${pre[@]}" --title "schemagen $GITHUB_REF_NAME" \
            --notes "Windows installer for schemagen $GITHUB_REF_NAME. Unsigned: Windows SmartScreen asks once (More info, Run anyway). Changes: see CHANGELOG.md."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schemagen-desktop-log
          path: ${{ runner.temp }}/schemagen-home/logs/
          if-no-files-found: ignore
