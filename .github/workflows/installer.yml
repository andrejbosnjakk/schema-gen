name: installer
on:
  push:
    branches: ["dev/1.0*"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # a v* tag publishes the installer as a GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inno Setup (preinstalled on windows-latest; install it if an image ever drops it)
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: build the app and the installer
        shell: pwsh
        run: ./packaging/build.ps1 -Python python
      - name: smoke test the built app (window opens, /api/health answers, closes cleanly)
        shell: pwsh
        run: ./packaging/smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: schemagen-installer
          path: packaging/dist/schemagen-setup-*.exe
          if-no-files-found: error
      - name: release on a v* tag (a tag with a "-", such as v1.2.0-dev, is a pre-release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-Item packaging/dist/schemagen-setup-*.exe).FullName
          $pre = if ($env:GITHUB_REF_NAME -like '*-*') { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME $exe @pre --title "schemagen $env:GITHUB_REF_NAME" --notes "Windows installer for schemagen $env:GITHUB_REF_NAME. Unsigned: Windows SmartScreen asks once (More info, Run anyway). Changes: see CHANGELOG.md."
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemagen-desktop-log
          path: ${{ runner.temp }}/schemagen-home/logs/
          if-no-files-found: ignore
