name: ci
# runs on pushes to main and the dev branches (work is pushed directly, without pull requests)
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:  # one Python per system: the oldest and the newest that CI covers
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz ngspice
      - if: runner.os == 'Windows'
        run: choco install graphviz -y --no-progress
      - run: pip install -e ".[dev]"
      - run: ruff check schemagen tests benchmarks tools frontend/e2e
      - run: python -m mypy schemagen
      # failed tests also become annotations on the run, so the cause shows on the summary page without opening the log
      - run: |
          set +e  # the step shell stops at the first failing line otherwise, before the annotations
          python -m pytest -q -rfE -m "not perf" --cov=schemagen --cov-report=term 2>&1 | tee pytest.log; s=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-900 | sed "s/^/::error::/" || true
          exit $s
      - run: python -m pytest -q -m perf
      - run: schemagen draw examples/demo
      # the demo has one finding on purpose (D97: no source on its 24 V bus), so check exits 1; any other exit code fails
      - run: (schemagen check examples/demo || test $? -eq 1) && schemagen sim examples/demo --faults all
      - uses: actions/upload-artifact@v4
        with:
          name: demo-drawings-${{ matrix.os }}-${{ matrix.python }}
          path: examples/demo/out/

  app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:  # one Python per system: the oldest and the newest that CI covers
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - if: runner.os == 'Windows'
        run: choco install graphviz -y --no-progress
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: built assets are committed and up to date
        if: runner.os == 'Linux'
        run: git diff --stat --exit-code schemagen/app/static
      - name: licences (Python and npm runtime dependencies)
        run: python tools/check_licences.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            frontend/e2e-results/
            frontend/test-results/

  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install build && python -m build --wheel
      - name: install the wheel with pipx in a clean environment
        run: pipx install dist/*.whl
      - name: start the installed app on the demo
        run: |
          cp -r examples/demo "$RUNNER_TEMP/demo"
          (cd "$RUNNER_TEMP" && schemagen app "$RUNNER_TEMP/demo" --no-browser --port 8765 > app.log 2>&1 &)
          for i in $(seq 60); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 1; done
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          SMOKE_URL: http://127.0.0.1:8765/
