name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz ngspice
      - run: pip install -e ".[dev]"
      - run: ruff check schemagen tests benchmarks tools
      - run: python -m mypy schemagen
      - run: python tools/check_licences.py
      - run: python -m pytest -q -m "not perf" --cov=schemagen --cov-report=term
      - run: python -m pytest -q -m perf
      - run: schemagen draw examples/demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-drawings
          path: examples/demo/out/
