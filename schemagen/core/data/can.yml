# CAN physical-layer limits used by the rules. Override in schemagen.yml: tables: {can: {...}}
source: "SAE J1939-11 (physical layer, 250 kbit/s): at most 30 nodes, stub length at most 1 m, two 120 ohm terminations"
max_nodes: 30
min_nodes: 2
terminators: 2
# stub length limit by bit rate (kbit/s -> m); `max_stub_m: <m>` in the project overrides it
bitrate_kbit: 250
max_stub_m_by_bitrate: {250: 1.0, 500: 0.3, 1000: 0.3}
stub_source: "SAE J1939-11 (250 kbit/s): stub at most 1 m; ISO 11898-2 design guideline (500 kbit/s and above): about 0.3 m"
# devices without CAN pin data whose code or name matches this are terminations (not nodes)
terminator_pattern: "^R-CAN|terminator|120 ?(Ω|ohm)"
