# Defaults for the DC simulation when part data is missing. Every value here is marked "assumed" in the results.
# Override in schemagen.yml: sim: {...}
contact_resistance_ohm: 0.005    # assumed: small crimped signal contact (20-24 AWG), a few milliohm
# assumed contact resistance by the wire gauge it carries (larger contacts for heavier wire); lighter than the
# lightest key uses contact_resistance_ohm
contact_resistance_by_awg: {0: 0.0002, 4: 0.0003, 8: 0.0005, 12: 0.001, 16: 0.002, 18: 0.003}
breaker_resistance_ohm: 0.005    # assumed: closed breaker / fuse
switch_resistance_ohm: 0.005     # assumed: closed switch or relay contact
fault_resistance_ohm: 0.001      # assumed: bolted short to ground
default_length_m: 1.0            # assumed: conductor length when no measured, design or zone estimate exists
service_loop_m: 0.3              # assumed: added to zone-to-zone estimates
temperature_C: 20                # conductor temperature
i_interrupt_A: 1000              # assumed interrupt rating when part data has none
# generic thermal trip curve (multiple of rating -> seconds), assumed when a breaker or fuse has no curve
generic_trip_curve: [[1.15, 3600], [1.5, 120], [2, 30], [5, 3], [10, 0.05]]
no_trip_below: 1.15              # multiple of rating that never trips (assumed, with the generic curve)
gmin_S: 1.0e-12                  # leak to ground for floating nodes (numerical)
