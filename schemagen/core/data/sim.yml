# Defaults for the DC simulation when part data is missing. Every value here is marked "assumed" in the results.
# Override in schemagen.yml: sim: {...}
contact_resistance_ohm: 0.005    # assumed: small crimped signal contact (20-24 AWG), a few milliohm
# assumed contact resistance by the wire gauge it carries (larger contacts for heavier wire); lighter than the
# lightest key uses contact_resistance_ohm
contact_resistance_by_awg: {0: 0.0002, 4: 0.0003, 8: 0.0005, 12: 0.001, 16: 0.002, 18: 0.003}
breaker_resistance_ohm: 0.005    # assumed: closed breaker / fuse
switch_resistance_ohm: 0.005     # assumed: closed switch or relay contact
fault_resistance_ohm: 0.001      # assumed: bolted short to ground
default_length_m: 1.0            # assumed: conductor length when no measured, design or zone estimate exists
service_loop_m: 0.3              # assumed: added to zone-to-zone estimates
temperature_C: 20                # conductor temperature
i_interrupt_A: 1000              # assumed interrupt rating when part data has none
# generic thermal trip curve (multiple of rating -> seconds), assumed when a breaker or fuse has no curve
generic_trip_curve: [[1.15, 3600], [1.5, 120], [2, 30], [5, 3], [10, 0.05]]
no_trip_below: 1.15              # multiple of rating that never trips (assumed, with the generic curve)
gmin_S: 1.0e-12                  # leak to ground for floating nodes (numerical)
# --infer (schemagen sim --infer or sim: {infer: true}): sources for devices without part data, matched by regex on
# the device code or name ("14 V battery", "DC/DC converter"; never a relay, switch, breaker, bus or splice);
# voltage from v_oc / v_out, else a battery's name ("24 V battery"), else the highest nominal bus voltage of its
# conductors. All assumed. Override or extend in schemagen.yml: sim: {sources: {"^GEN": {kind: dcdc, v_out: 14.2}}}
infer: false
# names that are never an inferred source although they say "battery" (they are loads or sensors)
not_sources: '(?i)\b(management|monitor|charger|sensor|temperature|contactor|switch)\b|\bBMS\b'
sources: {"^BAT": {kind: battery, r_int: 0.01}, "^DCDC": {kind: dcdc, r_out: 0.01},
          '(?i)\bbattery\b': {kind: battery, r_int: 0.01}, '(?i)\b(dc ?[/-]? ?dc|converter)\b': {kind: dcdc, r_out: 0.01}}
# the app's simulation (infer on): a device without part data and without a current value on its conductors draws this
# much (constant current) from its first supply conductor, so a bus with such devices counts as loaded. Assumed: a
# small instrument or controller; set the conductors' current (or part data) for real values.
default_load_A: 0.5
# overlay flags (design heuristics, not from a standard): a breaker above this share of its rating is a warning, and a
# wire at least this many sizes of the protection table heavier than its current and breaker need is "far heavier".
breaker_warn_loading: 0.8
oversize_steps: 3
