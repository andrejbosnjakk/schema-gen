<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness drawings</title><style>
:root{--bg:#fff;--fg:#1b1f24;--mut:#667;--line:#d8dce2;--acc:#1f3864;--hit:#ffe14d}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--fg:#e6e8eb;--mut:#9aa3ad;--line:#333a42;--acc:#8fb3ff;--hit:#8a6d00}}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;margin:0 auto;max-width:1200px;padding:16px}
h1{font-size:22px;margin:.2em 0}a{color:var(--acc)}small,.mut{color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.card b{font-size:16px}
input{font-size:16px;padding:8px 10px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.wrap{overflow-x:auto}#view{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:80vh;background:#fff}
#view svg{display:block}.hl{fill:#c00!important;font-weight:bold}.hlbox{fill:#ffe14d;opacity:.8}
</style></head><body>
<h1>Harness drawings</h1><p class="mut">Generated by schemagen from the wire list. Type a wire label (e.g. L05), wire id, device or function.
Click a row to open its drawing with the label highlighted.</p>
<div class="cards">__CARDS__</div>
<input id="q" placeholder="Search wire label, id, device, function…" autofocus>
<div class="wrap"><table><thead><tr><th>Label</th><th>Harness</th><th>Bundle</th><th>From</th><th>To</th><th>Gauge</th><th>Colour</th><th>Continues at</th></tr></thead><tbody id="res"></tbody></table></div>
<p id="cnt" class="mut"></p><div id="view"></div><div id="notes" class="wrap"></div>
<script>
const W=__DATA__, SVG=__SVGS__, NOTES=__NOTES__;
const q=document.getElementById('q'),res=document.getElementById('res'),cnt=document.getElementById('cnt'),view=document.getElementById('view'),notes=document.getElementById('notes');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(h,label){view.innerHTML=SVG[h]||'';const fn=NOTES[h]||[];
 notes.innerHTML=fn.length?'<h3>'+esc(h)+': continues at</h3><table><tr><th>#</th><th>Wire</th><th>Next wires (place) | net ends</th></tr>'+fn.map(f=>`<tr${f[1]===label?' style="background:var(--hit)"':''}><td>[${f[0]}]</td><td><b>${esc(f[1])}</b></td><td>${esc(f[2])}</td></tr>`).join('')+'</table>':'';
 if(!label)return;const re=new RegExp('(^|:)'+label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)');
 const t=[...view.querySelectorAll('text')].filter(x=>re.test(x.textContent.trim()));
 t.forEach(x=>{x.classList.add('hl');try{const b=x.getBBox(),r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',b.x-3);r.setAttribute('y',b.y-2);r.setAttribute('width',b.width+6);r.setAttribute('height',b.height+4);r.setAttribute('class','hlbox');x.parentNode.insertBefore(r,x)}catch(e){}});
 if(t[0])t[0].scrollIntoView({block:'center',inline:'center'})}
function run(){const s=q.value.trim().toLowerCase();let rows=W;if(s){const ex=W.filter(w=>w.label.toLowerCase()===s);rows=ex.length?ex:W.filter(w=>Object.values(w).join(' ').toLowerCase().includes(s))}
 res.innerHTML=rows.slice(0,300).map((w,i)=>`<tr data-h="${esc(w.harness)}" data-l="${esc(w.label)}" style="cursor:pointer"><td><b>${esc(w.label)}</b><br><small>${esc(w.id)}</small></td><td>${esc(w.harness)}</td><td>${esc(w.bundle)}</td><td>${esc(w.from)}</td><td>${esc(w.to)}</td><td>${esc(w.gauge)}</td><td>${esc(w.colour)}</td><td><small>${esc(w.cont)}</small></td></tr>`).join('');
 cnt.textContent=rows.length+' wire(s)'+(rows.length>300?' (first 300 shown)':'');if(s&&rows.length&&rows.every(r=>r.label===rows[0].label))show(rows[0].harness,rows[0].label)}
res.addEventListener('click',e=>{const tr=e.target.closest('tr');if(tr)show(tr.dataset.h,tr.dataset.l)});
q.addEventListener('input',run);const h=decodeURIComponent(location.hash.slice(1));if(h){q.value=h}run();
</script></body></html>
